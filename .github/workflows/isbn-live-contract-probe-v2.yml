name: Temporary ISBN live contract probe v2

on:
  push:
    branches:
      - chatgpt/fix-isbn-review-regressions

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/fix-isbn-review-regressions
          fetch-depth: 0
      - name: Probe live upstream contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.error
          import urllib.request

          def fetch(label, url):
              print(f'===== {label} =====')
              request = urllib.request.Request(url, headers={'User-Agent': 'Boekenbaai-review-probe/1.0'})
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      status = response.status
                      content_type = response.headers.get('content-type', '')
                      body = response.read().decode('utf-8', errors='replace')
              except urllib.error.HTTPError as error:
                  status = error.code
                  content_type = error.headers.get('content-type', '')
                  body = error.read().decode('utf-8', errors='replace')
              except Exception as error:
                  print(type(error).__name__, str(error))
                  print()
                  return None, None, ''
              print('status=', status)
              print('content-type=', content_type)
              print('body-prefix=', body[:1200].replace('\n', '\\n'))
              print()
              return status, content_type, body

          status, content_type, html = fetch(
              'Bureau ISBN exact search',
              'https://metadata.isbn.nl/search.html?search=9789059965607',
          )
          if html:
              work_index = html.lower().find('id="werk"')
              if work_index < 0:
                  work_index = html.lower().find("id='werk'")
              scoped = html[work_index:work_index + 30000] if work_index >= 0 else ''
              paths = re.findall(r'href=["\'](/\d+/[^"\']+\.html)["\']', scoped, flags=re.I)
              print('CB work result paths=', paths[:20])
              print('CB unique path count=', len(dict.fromkeys(paths)))
              print()

          fetch('Open Library ISBN-13', 'https://openlibrary.org/isbn/9789059965607.json')
          fetch('Open Library ISBN-10', 'https://openlibrary.org/isbn/9059965604.json')
          fetch('ISBNBarcode legacy metadata path', 'https://isbnbarcode.org/api/9789059965607')
          PY
      - name: Remove temporary probe workflow
        if: always()
        shell: bash
        run: |
          git config user.name "0xGitteth"
          git config user.email "160280586+0xGitteth@users.noreply.github.com"
          git rm .github/workflows/isbn-live-contract-probe-v2.yml
          git commit -m "Remove temporary ISBN live contract probe v2"
          git push origin HEAD:chatgpt/fix-isbn-review-regressions
