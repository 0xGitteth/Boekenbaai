name: Temporary ISBN NUR boundary validation

on:
  push:
    branches:
      - chatgpt/fix-isbn-review-regressions

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/fix-isbn-review-regressions
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply NUR boundary patch
        run: python .github/scripts/isbn_nur_boundary_fix.py

      - name: Check syntax and diff hygiene
        run: |
          git diff --check
          node --check isbn-lookup-core-impl.js
          node --check tests/isbn-wrapper-hardening.test.js

      - name: Install dependencies
        run: npm ci

      - name: Run focused ISBN regressions
        run: |
          node tests/isbn-wrapper-hardening.test.js
          node tests/isbn-lookup-core.test.js
          node tests/isbn-review-regressions.test.js
          node tests/isbn-tag-fallback.test.js

      - name: Run full test suite
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Commit validated fix and remove temporary tooling
        run: |
          git config user.name "0xGitteth"
          git config user.email "160280586+0xGitteth@users.noreply.github.com"
          git rm .github/workflows/isbn-nur-boundary-fix.yml .github/scripts/isbn_nur_boundary_fix.py
          git add isbn-lookup-core-impl.js tests/isbn-wrapper-hardening.test.js
          git diff --cached --check
          git commit -m "Bound Bureau ISBN edition NUR extraction"
          git push origin HEAD:chatgpt/fix-isbn-review-regressions
