name: Temporary ISBN self-review fix

on:
  push:
    branches:
      - chatgpt/fix-isbn-review-regressions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/fix-isbn-review-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Apply reviewed ISBN fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_block(path, pattern, replacement, label):
              p = Path(path)
              text = p.read_text()
              new_text, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(new_text)

          impl = 'isbn-lookup-core-impl.js'
          wrapper = 'isbn-lookup-core.js'
          test = 'tests/isbn-wrapper-hardening.test.js'

          replace_block(
              impl,
              r"function decodeHtml\(value\) \{.*?\n\}\n\nfunction stripHtml",
              r'''function decodeHtml(value) {
            const named = {
              amp: '&',
              quot: '"',
              apos: "'",
              lt: '<',
              gt: '>',
              nbsp: ' ',
              ndash: '–',
              mdash: '—',
              bull: '•',
            };
            const decodeCodePoint = (match, codePoint) => {
              const number = Number(codePoint);
              if (!Number.isInteger(number)
                || number < 0
                || number > 0x10FFFF
                || (number >= 0xD800 && number <= 0xDFFF)) {
                return match;
              }
              return String.fromCodePoint(number);
            };
            return String(value || '')
              .replace(/&#(\d+);/g, (match, code) => decodeCodePoint(match, Number(code)))
              .replace(/&#x([0-9a-f]+);/gi, (match, code) => (
                decodeCodePoint(match, Number.parseInt(code, 16))
              ))
              .replace(/&([a-z]+);/gi, (match, name) => (
                Object.prototype.hasOwnProperty.call(named, name.toLowerCase())
                  ? named[name.toLowerCase()]
                  : match
              ));
          }

          function stripHtml''',
              'safe HTML entity decoding',
          )

          replace_block(
              impl,
              r"function extractMeta\(html, name\) \{.*?\n\}\n\nfunction extractDefinition",
              r'''function extractMeta(html, name) {
            const wanted = String(name || '').toLowerCase();
            for (const tag of scanOpeningTags(html, 'meta')) {
              const attrs = parseHtmlAttributes(tag);
              const nameKey = String(attrs.name || '').toLowerCase();
              const propertyKey = String(attrs.property || '').toLowerCase();
              if ((nameKey === wanted || propertyKey === wanted) && attrs.content !== undefined) {
                return String(attrs.content).trim();
              }
            }
            return '';
          }

          function extractDefinition''',
              'dual meta attribute matching',
          )

          replace_block(
              impl,
              r"function toStringList\(value\) \{.*?\n\}\n\nfunction collectIsbnBarcodeIdentifiers",
              r'''function toStringList(value) {
            if (value === undefined || value === null) return [];
            if (Array.isArray(value)) return value.flatMap(toStringList);
            if (typeof value === 'string') {
              const text = value.trim();
              return text ? [text] : [];
            }
            if (typeof value === 'number' && Number.isFinite(value)) {
              return [String(value)];
            }
            if (typeof value === 'object') {
              for (const key of ['name', 'full_name', 'label', 'value', 'text', 'url', 'href']) {
                const nested = toStringList(value[key]);
                if (nested.length) return nested;
              }
            }
            return [];
          }

          function collectIsbnBarcodeIdentifiers''',
              'normalized string alias handling',
          )

          replace_block(
              impl,
              r"function collectIsbnBarcodeIdentifiers\(data\) \{.*?\n\}\n\nfunction parseIsbnBarcodeData\(data, targetIsbn\) \{.*?\n\}\n\nfunction dedupe",
              r'''function collectIsbnBarcodeIdentifiers(data) {
            const raw = [
              data.isbn,
              data.ean,
              data.isbn13,
              data.isbn_13,
              data.isbn10,
              data.isbn_10,
              data.barcode,
            ];
            const providedValues = raw.flatMap((entry) => (
              Array.isArray(entry) ? entry : entry === undefined || entry === null ? [] : [entry]
            )).filter((entry) => String(entry).trim() !== '');
            return {
              provided: providedValues.length > 0,
              identifiers: providedValues.map(normalizeIsbn).filter(Boolean),
            };
          }

          function parseIsbnBarcodeData(data, targetIsbn) {
            if (!data || typeof data !== 'object') return null;
            const family = new Set(getEquivalentIsbns(targetIsbn));
            if (!family.size) return null;

            const identifierEvidence = collectIsbnBarcodeIdentifiers(data);
            if (identifierEvidence.provided
              && !identifierEvidence.identifiers.some((identifier) => family.has(identifier))) {
              return null;
            }

            const mergeAliases = (...values) => dedupe(values.flatMap(toStringList));
            const firstAlias = (...values) => {
              for (const value of values) {
                const strings = toStringList(value);
                if (strings.length) return strings[0];
              }
              return '';
            };
            const firstRawAlias = (...values) => {
              for (const value of values) {
                if (value === undefined || value === null) continue;
                if (Array.isArray(value) && value.length === 0) continue;
                if (typeof value === 'string' && !value.trim()) continue;
                if (typeof value === 'number' && !Number.isFinite(value)) continue;
                if (typeof value === 'object' && !Array.isArray(value)) {
                  if (typeof value.value === 'string' && value.value.trim()) return value;
                  const strings = toStringList(value);
                  if (!strings.length) continue;
                  return strings[0];
                }
                return value;
              }
              return undefined;
            };

            const authors = mergeAliases(
              data.author,
              data.author_name,
              data.authors,
              data.contributors,
            );
            const title = firstAlias(
              data.title,
              data.book_title,
              data.item_name,
              data.name,
            );
            const descriptionValue = firstRawAlias(
              data.description,
              data.synopsis,
              data.summary,
            );
            const description = typeof descriptionValue === 'string'
              ? descriptionValue
              : descriptionValue?.value || '';
            const publishers = mergeAliases(
              data.publisher,
              data.publisher_name,
              data.publishers,
            );
            const languages = mergeAliases(
              data.language,
              data.languages,
              data.language_name,
            );
            const coverUrl = firstAlias(
              data.cover,
              data.cover_url,
              data.image,
              data.image_url,
              data.thumbnail,
            ).replace(/^http:\/\//i, 'https://');
            const publishedAt = firstAlias(data.publish_date, data.publication_date);
            const pageCount = numberFromValue(firstRawAlias(
              data.page_count,
              data.pages,
              data.number_of_pages,
            ));
            const tags = mergeAliases(data.categories, data.subjects, data.tags)
              .map((entry) => entry.toLowerCase());
            const language = normalizeLanguage(languages.join(' '));

            if (!title
              && !authors.length
              && !description
              && !publishers.length
              && !coverUrl
              && !publishedAt
              && !pageCount
              && !language
              && !tags.length) {
              return null;
            }

            return {
              barcode: normalizeIsbn(targetIsbn),
              title,
              author: authors.join(', '),
              authors,
              description: stripHtml(description),
              publisher: publishers.join(', '),
              publishedAt,
              publishedYear: yearFromDate(publishedAt),
              pageCount,
              language,
              coverUrl,
              tags,
              source: 'isbnbarcode.org',
              matchLevel: 'exact_isbn',
              found: true,
            };
          }

          function dedupe''',
              'ISBNBarcode alias parsing',
          )

          replace_block(
              impl,
              r"async function fetchAndConsume\(fetchImpl, url, options, timeoutMs, consume\) \{.*?\n\}\n\nasync function fetchText",
              r'''async function fetchAndConsume(fetchImpl, url, options, timeoutMs, consume) {
            if (typeof fetchImpl !== 'function') throw new Error('fetch_unavailable');
            const controller = typeof AbortController === 'function'
              ? new AbortController()
              : null;
            const timer = controller
              ? setTimeout(() => controller.abort(), timeoutMs)
              : null;
            try {
              const response = await fetchImpl(
                url,
                controller ? { ...options, signal: controller.signal } : options,
              );
              const status = Number(response?.status) || 0;
              if (!response) throw new Error('empty_fetch_response');
              if (!response.ok) {
                if (status === 404) return { response, value: null };
                const error = new Error(`http_${status || 'error'}`);
                error.name = 'HttpError';
                error.status = status;
                throw error;
              }
              if (status === 204) return { response, value: null };
              const value = await consume(response);
              return { response, value };
            } finally {
              if (timer) clearTimeout(timer);
            }
          }

          async function fetchText''',
              'primary HTTP status classification',
          )

          replace_block(
              impl,
              r"async function fetchJson\(fetchImpl, url, options = \{\}, timeoutMs = DEFAULT_TIMEOUT_MS\) \{.*?\n\}\n\nfunction createDebugPayload",
              r'''async function fetchJson(fetchImpl, url, options = {}, timeoutMs = DEFAULT_TIMEOUT_MS) {
            const { value } = await fetchAndConsume(
              fetchImpl,
              url,
              options,
              timeoutMs,
              async (response) => {
                const contentType = response.headers?.get?.('content-type') || '';
                if (contentType.includes('application/json') && typeof response.json === 'function') {
                  return response.json();
                }
                if (typeof response.text === 'function') {
                  const text = await response.text();
                  if (!text.trim()) throw new Error('empty_json_response');
                  try {
                    return JSON.parse(text);
                  } catch (error) {
                    const syntaxError = new SyntaxError('invalid_json_response');
                    syntaxError.cause = error;
                    throw syntaxError;
                  }
                }
                if (typeof response.json === 'function') return response.json();
                throw new Error('json_body_unavailable');
              },
            );
            return value;
          }

          function createDebugPayload''',
              'malformed primary JSON classification',
          )

          replace_block(
              impl,
              r"  async function lookupIsbnBarcode\(isbn, debug\) \{.*?\n  \}\n\n  function isComplete\(result\) \{.*?\n  \}",
              r'''  async function lookupIsbnBarcode(isbn, debug) {
            if (!isbnBarcodeEnabled) return null;
            for (const candidate of getEquivalentIsbns(isbn)) {
              try {
                debug?.sourcesTried.push('isbnbarcode.org');
                const data = await fetchJson(
                  fetchImpl,
                  `${isbnBarcodeBase}/${encodeURIComponent(candidate)}`,
                  { headers: { ...headers, Accept: 'application/json' } },
                  timeoutMs,
                );
                const metadata = parseIsbnBarcodeData(data, isbn);
                if (metadata?.found) {
                  if (debug) debug.sourceStatus['isbnbarcode.org'] = 'found';
                  return metadata;
                }
              } catch (error) {
                if (debug) {
                  debug.sourceStatus['isbnbarcode.org'] = error?.name === 'AbortError'
                    ? 'timeout'
                    : 'error';
                }
              }
            }
            if (debug && !debug.sourceStatus['isbnbarcode.org']) {
              debug.sourceStatus['isbnbarcode.org'] = 'not_found';
            }
            return null;
          }

          function isComplete(result) {
            return Boolean(
              result?.found
              && result.title
              && result.author
              && result.coverUrl
              && Array.isArray(result.tags)
              && result.tags.length,
            );
          }''',
              'internal equivalent ISBNBarcode lookup',
          )

          replace_block(
              impl,
              r"    const lookupPromise = \(async \(\) => \{.*?\n    \}\)\(\);\n\n    inflight\.set\(cacheKey, lookupPromise\);",
              r'''    const lookupPromise = (async () => {
              const sourceState = createDebugPayload(normalized, env);
              sourceState.sourcesConfigured = [
                'Bureau ISBN',
                ...(env.GOOGLE_BOOKS_API_KEY ? ['Google Books'] : []),
                'Open Library',
                ...(isbnBarcodeEnabled ? ['isbnbarcode.org'] : []),
              ];

              const [cbSettled, googleSettled, openSettled] = await Promise.allSettled([
                lookupCb(normalized, sourceState),
                lookupGoogle(normalized, sourceState),
                lookupOpenLibrary(normalized, sourceState),
              ]);

              const cb = cbSettled.status === 'fulfilled' ? cbSettled.value : null;
              const google = googleSettled.status === 'fulfilled' ? googleSettled.value : null;
              const openLibrary = openSettled.status === 'fulfilled' ? openSettled.value : null;

              let result = mergeExactMetadata({ cb, google, openLibrary }, normalized);
              if (isbnBarcodeEnabled && !isComplete(result)) {
                const isbnBarcode = await lookupIsbnBarcode(normalized, sourceState);
                result = mergeExactMetadata({ cb, google, openLibrary, isbnBarcode }, normalized);
              }

              result.barcode = normalized;
              const transientFailure = Object.values(sourceState.sourceStatus)
                .some((status) => status === 'error' || status === 'timeout');
              const ttl = result.found ? cacheTtlMs : negativeCacheTtlMs;
              const entry = {
                value: result,
                debug: debugEnabled ? sourceState : null,
                expiresAt: Date.now() + ttl,
              };
              if (!transientFailure) cache.set(cacheKey, entry);
              return entry;
            })();

            inflight.set(cacheKey, lookupPromise);''',
              'transient primary failure caching',
          )

          replace_block(
              wrapper,
              r"function escapeHtmlAttribute\(value\) \{.*?\n\}\n\nfunction parseCbDetailHtml",
              r'''function parseCbDetailHtml''',
              'remove CB alias synthesis helpers',
          )
          # The previous replacement intentionally leaves the existing parseCbDetailHtml body,
          # then remove the response-normalization helpers that followed it.
          replace_block(
              wrapper,
              r"function wrapCbResponse\(response\) \{.*?\n\}\n\nfunction explicitIdentifierEvidence",
              r'''function explicitIdentifierEvidence''',
              'remove CB response normalization',
          )
          p = Path(wrapper)
          text = p.read_text()
          text = text.replace(
              "  return impl.parseCbDetailHtml(normalizeCbMetaProperties(html), targetIsbn);",
              "  return impl.parseCbDetailHtml(html, targetIsbn);",
              1,
          )
          text = text.replace(
              "  const fetchImpl = createFetchWithCbMetaNormalization(baseFetchImpl);",
              "  const fetchImpl = baseFetchImpl;",
              1,
          )
          p.write_text(text)

          replace_block(
              wrapper,
              r"  async function loadFallback\(isbn\) \{.*?\n  \}\n\n  return async function lookupWithFallbackEnrichment",
              r'''  async function loadFallback(isbn) {
            const normalized = impl.normalizeIsbn(isbn);
            const cacheKey = impl.toIsbn13(normalized) || normalized;
            const cached = fallbackCache.get(cacheKey);
            if (cached && cached.expiresAt > Date.now()) return cached.value;
            if (cached) fallbackCache.delete(cacheKey);
            if (fallbackInflight.has(cacheKey)) return fallbackInflight.get(cacheKey);

            const promise = (async () => {
              if (typeof baseFetchImpl !== 'function') {
                return { metadata: null, status: 'error', requestUrls: [] };
              }

              let sawError = false;
              let sawTimeout = false;
              const requestUrls = [];
              for (const candidate of impl.getEquivalentIsbns(normalized)) {
                const controller = typeof AbortController === 'function' ? new AbortController() : null;
                const timer = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;
                const requestUrl = `${isbnBarcodeBase}/${encodeURIComponent(candidate)}`;
                requestUrls.push(requestUrl);
                try {
                  const response = await baseFetchImpl(
                    requestUrl,
                    {
                      headers: {
                        Accept: 'application/json',
                        'User-Agent': userAgent,
                      },
                      ...(controller ? { signal: controller.signal } : {}),
                    },
                  );
                  if (!response?.ok) {
                    if (response?.status !== 404) sawError = true;
                    continue;
                  }

                  let data = null;
                  const contentType = response.headers?.get?.('content-type') || '';
                  if (contentType.includes('application/json') && typeof response.json === 'function') {
                    data = await response.json();
                  } else if (typeof response.text === 'function') {
                    const text = await response.text();
                    if (!text.trim()) {
                      sawError = true;
                      continue;
                    }
                    try {
                      data = JSON.parse(text);
                    } catch (_error) {
                      sawError = true;
                      continue;
                    }
                  } else if (typeof response.json === 'function') {
                    data = await response.json();
                  } else {
                    sawError = true;
                    continue;
                  }

                  const metadata = parseIsbnBarcodeData(data, normalized);
                  if (metadata?.found) {
                    const value = { metadata, status: 'found', requestUrls };
                    fallbackCache.set(cacheKey, {
                      value,
                      expiresAt: Date.now() + cacheTtlMs,
                    });
                    return value;
                  }
                } catch (error) {
                  if (error?.name === 'AbortError') sawTimeout = true;
                  else sawError = true;
                } finally {
                  if (timer) clearTimeout(timer);
                }
              }

              const status = sawError ? 'error' : sawTimeout ? 'timeout' : 'not_found';
              const value = { metadata: null, status, requestUrls };
              if (status === 'not_found') {
                fallbackCache.set(cacheKey, {
                  value,
                  expiresAt: Date.now() + negativeCacheTtlMs,
                });
              }
              return value;
            })();

            fallbackInflight.set(cacheKey, promise);
            try {
              return await promise;
            } finally {
              fallbackInflight.delete(cacheKey);
            }
          }

          return async function lookupWithFallbackEnrichment''',
              'equivalent fallback lookup and cache behavior',
          )

          p = Path(wrapper)
          text = p.read_text()
          old = """        sourceStatus: {\n          ...(result.debug.sourceStatus || {}),\n          'isbnbarcode.org': fallback.status,\n        },\n"""
          new = """        sourceStatus: {\n          ...(result.debug.sourceStatus || {}),\n          'isbnbarcode.org': fallback.status,\n        },\n        isbnbarcode: {\n          ...(result.debug.isbnbarcode || {}),\n          enabled: true,\n          requestUrl: fallback.requestUrls?.[0] || '',\n          requestUrls: fallback.requestUrls || [],\n        },\n"""
          if old not in text:
              raise SystemExit('fallback debug block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path(test)
          text = p.read_text()
          text = text.replace(
              "  createIsbnLookup,\n  extractMeta,\n  parseIsbnBarcodeData,\n",
              "  createIsbnLookup,\n  extractMeta,\n  parseCbDetailHtml,\n  parseIsbnBarcodeData,\n",
              1,
          )
          text = text.replace(
              "const assert = require('assert');\n",
              "const assert = require('assert');\nconst implDirect = require('../isbn-lookup-core-impl');\n",
              1,
          )
          text = text.replace(
              "    assert.strictEqual(negativeFallbackCalls, 1);\n    now += 500;",
              "    assert.strictEqual(negativeFallbackCalls, 2);\n    now += 500;",
              1,
          )
          text = text.replace(
              "      negativeFallbackCalls,\n      1,\n      'Negative fallback result must stay cached inside its configured TTL',",
              "      negativeFallbackCalls,\n      2,\n      'Negative fallback result must stay cached inside its configured TTL after exhausting equivalent ISBNs',",
              1,
          )
          text = text.replace(
              "      negativeFallbackCalls,\n      2,\n      'Negative fallback cache must expire using BOEKENBAAI_ISBN_NEGATIVE_CACHE_TTL_MS',",
              "      negativeFallbackCalls,\n      4,\n      'Negative fallback cache must expire using BOEKENBAAI_ISBN_NEGATIVE_CACHE_TTL_MS',",
              1,
          )

          marker = "  console.log('ISBN wrapper hardening regression tests passed');"
          if marker not in text:
              raise SystemExit('hardening test marker not found')
          extra = r'''
            const orderedCbHtml = [
              '<meta name="twitter:title" property="og:title" content="Correct eerst">',
              '<meta property="og:title" content="Later fout">',
              '<div class="uitv">',
              '<div class="uvlabel">Paperback</div>',
              '<span>ISBN</span><br>9789059965607<br><br>',
              '</div>',
            ].join('');
            assert.strictEqual(
              parseCbDetailHtml(orderedCbHtml, isbn).title,
              'Correct eerst',
              'Bureau ISBN parsing must preserve first-match ordering for dual name/property meta tags',
            );
            assert.strictEqual(
              implDirect.extractMeta(
                '<meta name="twitter:title" property="og:title" content="Correct eerst"><meta property="og:title" content="Later fout">',
                'og:title',
              ),
              'Correct eerst',
              'The internal meta extractor must match property independently without alias synthesis',
            );

            const aliasHeavy = parseIsbnBarcodeData({
              isbn,
              title: [],
              book_title: 'Titel uit tweede alias',
              author: [],
              authors: ['Auteur uit tweede alias'],
              publisher: [],
              publishers: ['Uitgever uit tweede alias'],
              language: [],
              languages: ['Nederlands'],
              cover: [],
              cover_url: 'http://example.test/alias-cover.jpg',
              publish_date: [],
              publication_date: '2026-09-09',
              page_count: [],
              pages: 222,
              categories: [],
              subjects: ['Fantasy'],
            }, isbn);
            assert.ok(aliasHeavy?.found);
            assert.strictEqual(aliasHeavy.title, 'Titel uit tweede alias');
            assert.strictEqual(aliasHeavy.author, 'Auteur uit tweede alias');
            assert.strictEqual(aliasHeavy.publisher, 'Uitgever uit tweede alias');
            assert.strictEqual(aliasHeavy.language, 'nl');
            assert.strictEqual(aliasHeavy.coverUrl, 'https://example.test/alias-cover.jpg');
            assert.strictEqual(aliasHeavy.publishedAt, '2026-09-09');
            assert.strictEqual(aliasHeavy.pageCount, 222);
            assert.deepStrictEqual(aliasHeavy.tags, ['fantasy']);
            const directAliasHeavy = implDirect.parseIsbnBarcodeData({
              isbn,
              author: [],
              authors: ['Direct auteur'],
              publisher: [],
              publishers: ['Direct uitgever'],
              language: [],
              languages: ['Nederlands'],
              categories: [],
              tags: ['Jeugd'],
            }, isbn);
            assert.strictEqual(directAliasHeavy.author, 'Direct auteur');
            assert.strictEqual(directAliasHeavy.publisher, 'Direct uitgever');
            assert.strictEqual(directAliasHeavy.language, 'nl');
            assert.deepStrictEqual(directAliasHeavy.tags, ['jeugd']);
            assert.strictEqual(
              implDirect.parseIsbnBarcodeData({ isbn: 'geen-isbn', title: 'Niet accepteren' }, isbn),
              null,
              'The internal parser must reject provided but invalid explicit ISBN evidence',
            );

            const isbn10 = implDirect.toIsbn10(isbn);
            const equivalentFallbackUrls = [];
            const equivalentLookup = createIsbnLookup({
              fetchImpl: async (url) => {
                const textUrl = String(url);
                if (textUrl.includes('metadata.isbn.nl/search')) {
                  return response('<div id="werk"></div>', { contentType: 'text/html' });
                }
                if (textUrl.includes('openlibrary.org')) return response({}, { status: 404 });
                if (textUrl.includes('isbnbarcode.org/api')) {
                  equivalentFallbackUrls.push(textUrl);
                  if (textUrl.endsWith(`/${isbn10}`)) return response({}, { status: 404 });
                  if (textUrl.endsWith(`/${isbn}`)) {
                    return response({ isbn, title: 'Gevonden via ISBN13', author: 'Auteur' });
                  }
                }
                throw new Error(`Unexpected request ${textUrl}`);
              },
              env: { BOEKENBAAI_ENABLE_ISBNBARCODE: 'true' },
            });
            const fromIsbn10 = await equivalentLookup(isbn10);
            assert.strictEqual(fromIsbn10.title, 'Gevonden via ISBN13');
            assert.strictEqual(fromIsbn10.barcode, isbn10);
            assert.deepStrictEqual(
              equivalentFallbackUrls.map((url) => url.split('/').pop()),
              [isbn10, isbn],
              'Fallback must exhaust equivalent ISBN representations before caching a miss',
            );
            const equivalentCallsBeforeCache = equivalentFallbackUrls.length;
            const fromIsbn13Cache = await equivalentLookup(isbn);
            assert.strictEqual(fromIsbn13Cache.title, 'Gevonden via ISBN13');
            assert.strictEqual(fromIsbn13Cache.barcode, isbn);
            assert.strictEqual(equivalentFallbackUrls.length, equivalentCallsBeforeCache);

            let transientPrimaryCalls = 0;
            const transientPrimaryLookup = createIsbnLookup({
              fetchImpl: async (url) => {
                const textUrl = String(url);
                transientPrimaryCalls += 1;
                if (textUrl.includes('metadata.isbn.nl/search')) return response('', { status: 500, contentType: 'text/html' });
                if (textUrl.includes('googleapis.com/books')) return response({}, { status: 429 });
                if (textUrl.includes('openlibrary.org')) return response({}, { status: 503 });
                throw new Error(`Unexpected request ${textUrl}`);
              },
              env: {
                GOOGLE_BOOKS_API_KEY: 'test-key',
                BOEKENBAAI_DEBUG_ISBN_LOOKUP: 'true',
              },
            });
            const transientFirst = await transientPrimaryLookup(isbn, { includeDebug: true });
            assert.strictEqual(transientFirst.found, false);
            assert.strictEqual(transientFirst.debug.sourceStatus['Bureau ISBN'], 'error');
            assert.strictEqual(transientFirst.debug.sourceStatus['Google Books'], 'error');
            assert.strictEqual(transientFirst.debug.sourceStatus['Open Library'], 'error');
            const transientCallsAfterFirst = transientPrimaryCalls;
            await transientPrimaryLookup(isbn, { includeDebug: true });
            assert.ok(
              transientPrimaryCalls > transientCallsAfterFirst,
              'Transient primary failures must not be negatively cached as a genuine ISBN miss',
            );

            let fallbackTransientCalls = 0;
            const fallbackTransientLookup = createIsbnLookup({
              fetchImpl: primaryFetch({
                isbn,
                google: googlePayload(isbn, {
                  imageLinks: { thumbnail: 'https://example.test/google-cover.jpg' },
                }),
                fallback: async () => {
                  fallbackTransientCalls += 1;
                  return response({}, { status: 500 });
                },
              }),
              env: {
                GOOGLE_BOOKS_API_KEY: 'test-key',
                BOEKENBAAI_ENABLE_ISBNBARCODE: 'true',
              },
            });
            await fallbackTransientLookup(isbn);
            const fallbackTransientAfterFirst = fallbackTransientCalls;
            await fallbackTransientLookup(isbn);
            assert.ok(
              fallbackTransientCalls > fallbackTransientAfterFirst,
              'Transient ISBNBarcode failures must not be cached as not-found metadata',
            );

            assert.doesNotThrow(() => implDirect.extractMeta(
              '<meta property="og:title" content="Bad &#99999999; entity">',
              'og:title',
            ));

