name: Temporary ISBN live contract probe

on:
  push:
    branches:
      - chatgpt/fix-isbn-review-regressions

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/fix-isbn-review-regressions
          fetch-depth: 0
      - name: Probe live upstream contracts
        shell: bash
        run: |
          set -u
          probe() {
            label="$1"
            url="$2"
            echo "===== $label ====="
            rm -f /tmp/probe-headers /tmp/probe-body
            curl -L -sS --max-time 10 -A 'Boekenbaai-review-probe/1.0' -D /tmp/probe-headers -o /tmp/probe-body "$url"
            curl_exit=$?
            echo "curl_exit=$curl_exit"
            head -n 20 /tmp/probe-headers || true
            echo "--- body first 1200 bytes ---"
            head -c 1200 /tmp/probe-body || true
            echo
            echo
          }

          probe "Bureau ISBN exact search" "https://metadata.isbn.nl/search.html?search=9789059965607"
          echo "CB wrk class count: $(grep -Eoi 'class=["'"'][^"'"']*wrk[^"'"']*["'"']' /tmp/probe-body | wc -l || true)"
          echo "CB detail links:"
          grep -Eo 'href=["'"']/[0-9]+/[^"'"']+\.html["'"']' /tmp/probe-body | head -n 12 || true
          echo

          probe "Open Library ISBN-13" "https://openlibrary.org/isbn/9789059965607.json"
          probe "Open Library ISBN-10" "https://openlibrary.org/isbn/9059965604.json"
          probe "ISBNBarcode legacy metadata path" "https://isbnbarcode.org/api/9789059965607"
      - name: Remove temporary probe workflow
        if: always()
        shell: bash
        run: |
          git config user.name "0xGitteth"
          git config user.email "160280586+0xGitteth@users.noreply.github.com"
          git rm .github/workflows/isbn-live-contract-probe.yml
          git commit -m "Remove temporary ISBN live contract probe"
          git push origin HEAD:chatgpt/fix-isbn-review-regressions
