name: Temporary ISBN self-review round 2

on:
  push:
    branches:
      - chatgpt/fix-isbn-review-regressions

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/fix-isbn-review-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Apply self-review fixes
        run: python scripts/tmp-isbn-self-review-round2.py
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run focused ISBN regressions
        run: |
          node tests/isbn-wrapper-hardening.test.js
          node tests/isbn-review-regressions.test.js
          node tests/isbn-tag-fallback.test.js
          node tests/isbn-lookup-core.test.js
      - name: Run full test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit fixes and remove temporary files
        shell: bash
        run: |
          git config user.name "0xGitteth"
          git config user.email "160280586+0xGitteth@users.noreply.github.com"
          git rm .github/workflows/isbn-self-review-round2.yml scripts/tmp-isbn-self-review-round2.py
          git add isbn-lookup-core-impl.js isbn-lookup-core.js tests/isbn-wrapper-hardening.test.js
          git commit -m "Harden ISBN lookup after independent review"
          git push origin HEAD:chatgpt/fix-isbn-review-regressions
