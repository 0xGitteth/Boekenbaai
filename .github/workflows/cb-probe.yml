name: CB metadata probe

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Run focused exact-edition tests
        run: node tests/isbn-lookup-core.test.js
      - name: Live CB exact-ISBN smoke test
        shell: bash
        run: |
          set -euxo pipefail
          node - <<'NODE'
          const { createIsbnLookup } = require('./isbn-lookup-core');
          (async () => {
            const lookup = createIsbnLookup({ fetchImpl: global.fetch, env: process.env, timeoutMs: 3500 });
            const result = await lookup('9789059965607');
            if (!result.found || result.matchLevel !== 'exact_isbn') throw new Error('CB exact ISBN not found');
            if (result.title !== 'Murdoku Terug in de tijd') throw new Error(`Unexpected title: ${result.title}`);
            if (!result.sources.includes('Bureau ISBN')) throw new Error(`CB source missing: ${JSON.stringify(result.sources)}`);
            console.log(JSON.stringify({ title: result.title, author: result.author, publisher: result.publisher, language: result.language, cover: Boolean(result.coverUrl), sources: result.sources }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
