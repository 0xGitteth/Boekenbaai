name: CB metadata probe

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect metadata.isbn.nl exact ISBN search
        shell: bash
        run: |
          set -euxo pipefail
          UA='Boekenbaai/1.0 school-library metadata lookup research'
          ISBN='9789059965607'
          curl -L --max-time 20 -A "$UA" -c /tmp/cookies.txt -o /tmp/home.html https://metadata.isbn.nl/
          curl -L --max-time 20 -A "$UA" -b /tmp/cookies.txt -D /tmp/search-headers.txt \
            --get --data-urlencode "search=$ISBN" \
            -o /tmp/search.html https://metadata.isbn.nl/search.html
          echo '--- SEARCH HEADERS ---'
          cat /tmp/search-headers.txt
          echo '--- SEARCH TITLE / LINKS / ISBN CONTEXT ---'
          grep -Ein -C 4 "$ISBN|Zoekresultaten|Murdoku|href=" /tmp/search.html | head -n 220 || true
          echo '--- DETAIL LINKS ---'
          grep -Eio 'href="/[0-9]+/[^"]+\.html"' /tmp/search.html | head -n 30 || true
          echo '--- RESPONSE SIZE ---'
          wc -c /tmp/search.html
