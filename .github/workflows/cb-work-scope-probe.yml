name: Temporary Bureau ISBN work scope probe
on:
  push:
    branches: [chatgpt/fix-isbn-review-regressions]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/fix-isbn-review-regressions
      - name: Inspect live work result DOM
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen

          url = 'https://metadata.isbn.nl/search.html?search=9789059965607'
          req = Request(url, headers={'User-Agent':'Boekenbaai-review-probe/1.0'})
          html = urlopen(req, timeout=12).read().decode('utf-8','replace')

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack=[]
                  self.in_werk=False
                  self.werk_depth=None
                  self.wrk_depths=[]
                  self.current=None
                  self.results=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  self.stack.append(tag)
                  depth=len(self.stack)
                  if tag=='div' and attrs.get('id')=='werk' and not self.in_werk:
                      self.in_werk=True; self.werk_depth=depth
                  if self.in_werk and tag=='div' and 'wrk' in (attrs.get('class') or '').split():
                      self.wrk_depths.append(depth)
                      self.current={'hrefs':[], 'text':[]}
                  if self.in_werk and self.current is not None and tag=='a' and attrs.get('href'):
                      self.current['hrefs'].append(attrs['href'])
              def handle_data(self, data):
                  if self.in_werk and self.current is not None:
                      text=' '.join(data.split())
                      if text: self.current['text'].append(text)
              def handle_endtag(self, tag):
                  depth=len(self.stack)
                  if self.in_werk and self.current is not None and self.wrk_depths and depth==self.wrk_depths[-1] and tag=='div':
                      self.results.append(self.current); self.current=None; self.wrk_depths.pop()
                  if self.in_werk and depth==self.werk_depth and tag=='div':
                      self.in_werk=False
                  if self.stack: self.stack.pop()
          p=Parser(); p.feed(html)
          print('werk_result_count=', len(p.results))
          for i,r in enumerate(p.results,1):
              print(i, r['hrefs'][:3], 'TEXT=', ' '.join(r['text'])[:500])
          print('query_isbn_occurrences=', html.count('9789059965607'))
          PY
      - name: Remove probe workflow
        if: always()
        run: |
          git config user.name "0xGitteth"
          git config user.email "160280586+0xGitteth@users.noreply.github.com"
          git rm .github/workflows/cb-work-scope-probe.yml
          git commit -m "Remove temporary Bureau ISBN scope probe"
          git push origin HEAD:chatgpt/fix-isbn-review-regressions
