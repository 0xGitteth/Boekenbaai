name: Temporary ISBN parser dedupe fix

on:
  push:
    branches:
      - chatgpt/fix-isbn-review-regressions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/fix-isbn-review-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Apply final alias cleanup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('isbn-lookup-core-impl.js')
          text = p.read_text()
          raw_block = """  const firstRawAlias = (...values) => {
    for (const value of values) {
      if (value === undefined || value === null) continue;
      if (Array.isArray(value) && value.length === 0) continue;
      if (typeof value === 'string' && !value.trim()) continue;
      if (typeof value === 'number' && !Number.isFinite(value)) continue;
      if (typeof value === 'object' && !Array.isArray(value)) {
        if (typeof value.value === 'string' && value.value.trim()) return value;
        const strings = toStringList(value);
        if (!strings.length) continue;
        return strings[0];
      }
      return value;
    }
    return undefined;
  };

"""
          if raw_block not in text:
              raise SystemExit('firstRawAlias block not found')
          text = text.replace(raw_block, '', 1)
          old_desc = """  const descriptionValue = firstRawAlias(
    data.description,
    data.synopsis,
    data.summary,
  );
  const description = typeof descriptionValue === 'string'
    ? descriptionValue
    : descriptionValue?.value || '';
"""
          new_desc = """  const description = firstAlias(
    data.description,
    data.synopsis,
    data.summary,
  );
"""
          if old_desc not in text:
              raise SystemExit('description block not found')
          text = text.replace(old_desc, new_desc, 1)
          old_pages = """  const pageCount = numberFromValue(firstRawAlias(
    data.page_count,
    data.pages,
    data.number_of_pages,
  ));
"""
          new_pages = """  const pageCount = numberFromValue(firstAlias(
    data.page_count,
    data.pages,
    data.number_of_pages,
  ));
"""
          if old_pages not in text:
              raise SystemExit('page block not found')
          p.write_text(text.replace(old_pages, new_pages, 1))

          p = Path('tests/isbn-wrapper-hardening.test.js')
          text = p.read_text()
          needle = "  assert.deepStrictEqual(aliasHeavy.tags, ['fantasy']);\n"
          addition = """  assert.deepStrictEqual(aliasHeavy.tags, ['fantasy']);
  const arrayDescription = implDirect.parseIsbnBarcodeData({
    isbn,
    description: ['Beschrijving uit array'],
    page_count: [144],
  }, isbn);
  assert.strictEqual(arrayDescription.description, 'Beschrijving uit array');
  assert.strictEqual(arrayDescription.pageCount, 144);
"""
          if needle not in text:
              raise SystemExit('test insertion point not found')
          p.write_text(text.replace(needle, addition, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused ISBN regressions
        run: |
          node tests/isbn-wrapper-hardening.test.js
          node tests/isbn-review-regressions.test.js
          node tests/isbn-tag-fallback.test.js
          node tests/isbn-lookup-core.test.js
      - name: Run full tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "0xGitteth"
          git config user.email "160280586+0xGitteth@users.noreply.github.com"
          git rm .github/workflows/isbn-parser-dedupe-fix.yml
          git add isbn-lookup-core-impl.js tests/isbn-wrapper-hardening.test.js
          git commit -m "Close remaining ISBN alias edge case"
          git push origin HEAD:chatgpt/fix-isbn-review-regressions
