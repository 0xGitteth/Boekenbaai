name: Temporary ISBN parser dedupe fix

on:
  push:
    branches:
      - chatgpt/fix-isbn-review-regressions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/fix-isbn-review-regressions
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Apply cleanup
        run: python scripts/apply-isbn-final-cleanup.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused ISBN regressions
        run: |
          node tests/isbn-wrapper-hardening.test.js
          node tests/isbn-review-regressions.test.js
          node tests/isbn-tag-fallback.test.js
          node tests/isbn-lookup-core.test.js
      - name: Run full tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit fixes and remove temporary files
        shell: bash
        run: |
          git config user.name "0xGitteth"
          git config user.email "160280586+0xGitteth@users.noreply.github.com"
          git rm .github/workflows/isbn-parser-dedupe-fix.yml scripts/apply-isbn-final-cleanup.py
          git add isbn-lookup-core-impl.js tests/isbn-wrapper-hardening.test.js
          git commit -m "Close remaining ISBN alias edge case"
          git push origin HEAD:chatgpt/fix-isbn-review-regressions
